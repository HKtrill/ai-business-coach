# Central pytest configuration for prototype/bank_pipeline (PR 36).
#
# Run from this directory:
#     pytest                      fast default suite
#     pytest -m slow              expensive synthetic integration checks
#     pytest -m notebook          checks that execute notebook code
#     pytest -m realdata          audit of the saved artifacts (after regeneration)
#
# A later -m on the command line replaces the default selection in addopts.

[pytest]
minversion = 8.0
testpaths = tests
# Make `shared`, `data`, `glass_pipeline`, `blackbox_pipeline`, `feature_research`
# and `tests` importable without installing the package or chdir-ing.
pythonpath = .
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not slow and not notebook and not realdata"
markers =
    slow: expensive synthetic integration checks; excluded by default
    notebook: executes notebook code; excluded by default
    realdata: audits the saved artifacts and data/db; runs only when -m names realdata
xfail_strict = true
filterwarnings =
    ignore:Constructing LpVariable\(name, \.\.\.\) directly is deprecated:DeprecationWarning
    ignore:PULP_CBC_CMD is deprecated:DeprecationWarning
